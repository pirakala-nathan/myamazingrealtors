# Netlify build settings. In the Netlify UI, set Base directory to "web".
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime turns the .next build output into pages and server
# functions. Without it Netlify uploads .next as plain files and every page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
